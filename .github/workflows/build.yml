name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🆕 مفتاح توقيع ثابت لكل النسخ - عشان تقدر تحدث فوق النسخة القديمة بدل ما تمسحها كل مرة.
      # من غير الخطوة دي، Gradle كان بيولّد مفتاح توقيع عشوائي جديد في كل بيلد (لأن كل تشغيلة
      # GitHub Actions بتبدأ من جهاز افتراضي فاضي تمامًا)، فالتحديث كان دايمًا بيفشل بخطأ
      # "تعارض في الحزمة" لأن الشهادات مختلفة بين نسخة ونسخة.
      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # 🆕 بنركّب Firebase (لازم للإشعارات اللحظية Push Notifications اللي بتشتغل
      # حتى لو التطبيق قافل تمامًا). ملف google-services.json مش سري (مجرد
      # معرّفات عامة للمشروع)، فمخزّن في الريبو نفسه. بنحطه في مكانه الصح جوه
      # مشروع أندرويد، وبنضيف الـ Google Services Gradle plugin يدويًا لأن
      # فولدر android/ بيتولّد من الصفر في كل بيلد (مش موجود في الريبو أصلًا).
      # نفس الخطوة بالظبط الموجودة في مشروع الماركت، عشان الإشعارات تشتغل بنفس الكفاءة.
      - name: Add Firebase (google-services)
        run: |
          cp google-services.json android/app/google-services.json
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          sed -i "s#classpath 'com.android.tools.build:gradle:[^']*'#&\n        classpath 'com.google.gms:google-services:4.4.4'#" "$PROJECT_GRADLE"
          sed -i "s#^apply plugin: 'com.android.application'#&\napply plugin: 'com.google.gms.google-services'#" "$APP_GRADLE"
          echo "----- android/build.gradle بعد التعديل -----"
          cat "$PROJECT_GRADLE"
          echo "----- android/app/build.gradle بعد التعديل -----"
          cat "$APP_GRADLE"

      - name: Sync Capacitor
        run: npx cap sync android

      # 🆕 بلجن @capacitor/geolocation مش بيضيف صلاحيات الموقع لملف الـ Manifest لوحده -
      # ده موضّح رسميًا في توثيق Capacitor إن المطوّر لازم يضيفها يدويًا. وبما إننا بنعمل
      # "cap add android" من الصفر في كل بيلد، بنضيف الصلاحيات هنا تلقائيًا بعد كل مرة.
      # وضفنا كمان POST_NOTIFICATIONS - أندرويد 13+ (API 33) محتاجها صراحة عشان
      # التطبيق يقدر يعرض إشعارات Push من غير ما يتفتح - بالظبط زي الماركت.
      # 🆕 التتبع في الخلفية (لما الشاشة تتقفل أو التطبيق يروح للخلفية): محتاج
      # ACCESS_BACKGROUND_LOCATION (إذن منفصل عن إذن الموقع العادي بداية أندرويد 10)،
      # و FOREGROUND_SERVICE عشان خدمة التتبع تقدر تشتغل وهي مش في المقدمة، و
      # FOREGROUND_SERVICE_LOCATION (لازمة بداية أندرويد 14/API 34 لأي خدمة نوعها "location")
      - name: Add location permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد التعديل -----"
          cat "$MANIFEST"

      # 🆕 الأيقونة العائمة (Floating Bubble) - كود Android أصلي مش بيتولّد تلقائيًا
      # من Capacitor، فبننسخه يدويًا لمجلد المشروع بعد ما "cap add android" يعمل
      # الهيكل الأساسي، وبنسجّله كـ Capacitor Plugin جوه MainActivity، وبنضيف
      # صلاحية "الرسم فوق التطبيقات الأخرى" وتعريف الخدمة في الـ Manifest، وبنخلي
      # الـ Activity الرئيسية "singleTask" عشان دوسة الأيقونة العائمة ترجّع نفس
      # النسخة الشغالة فعلًا (وتحافظ على حالة الـ JS) بدل ما تفتح نسخة جديدة
      - name: Add floating bubble native plugin
        run: |
          PKG_DIR="android/app/src/main/java/com/mgaper/gphalyrider"
          mkdir -p "$PKG_DIR"
          cp android-native/FloatingBubbleService.java "$PKG_DIR/FloatingBubbleService.java"
          cp android-native/FloatingBubblePlugin.java "$PKG_DIR/FloatingBubblePlugin.java"

          if [ -f "$PKG_DIR/MainActivity.java" ] || [ -f "$PKG_DIR/MainActivity.kt" ]; then
            python3 - <<'PYEOF'
          import os, re
          pkg_dir = "android/app/src/main/java/com/mgaper/gphalyrider"
          path = None
          for candidate in [os.path.join(pkg_dir, "MainActivity.java"), os.path.join(pkg_dir, "MainActivity.kt")]:
              if os.path.exists(candidate):
                  path = candidate
                  break
          content = open(path, encoding='utf-8').read()

          # القالب الافتراضي لـ Capacitor الحديث غالبًا بيبقى سطر واحد فاضي من غير
          # onCreate خالص - لو حاولنا ندخل السطر جوه onCreate موجود مش هنلاقي حاجة
          # نطابقها. الكود ده بيتعامل مع الحالتين.
          if path.endswith('.java'):
              if 'registerPlugin(FloatingBubblePlugin.class)' in content:
                  pass
              elif 'super.onCreate(savedInstanceState)' in content:
                  content = content.replace(
                      'super.onCreate(savedInstanceState);',
                      'registerPlugin(FloatingBubblePlugin.class);\n        super.onCreate(savedInstanceState);',
                      1
                  )
              else:
                  content = re.sub(
                      r'public class MainActivity extends BridgeActivity\s*\{\s*\}',
                      'public class MainActivity extends BridgeActivity {\n'
                      '    @Override\n'
                      '    public void onCreate(android.os.Bundle savedInstanceState) {\n'
                      '        registerPlugin(FloatingBubblePlugin.class);\n'
                      '        super.onCreate(savedInstanceState);\n'
                      '    }\n'
                      '}',
                      content
                  )
          else:
              if 'registerPlugin(FloatingBubblePlugin::class.java)' in content:
                  pass
              elif 'super.onCreate(savedInstanceState)' in content:
                  content = content.replace(
                      'super.onCreate(savedInstanceState)',
                      'registerPlugin(FloatingBubblePlugin::class.java)\n        super.onCreate(savedInstanceState)',
                      1
                  )
              else:
                  content = re.sub(
                      r'class MainActivity\s*:\s*BridgeActivity\(\)\s*\{?\s*\}?',
                      'class MainActivity : BridgeActivity() {\n'
                      '    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n'
                      '        registerPlugin(FloatingBubblePlugin::class.java)\n'
                      '        super.onCreate(savedInstanceState)\n'
                      '    }\n'
                      '}',
                      content
                  )

          open(path, 'w', encoding='utf-8').write(content)
          print("----- MainActivity بعد التعديل -----")
          print(content)
          PYEOF
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />#' "$MANIFEST"
          if ! grep -q 'android:launchMode="singleTask"' "$MANIFEST"; then
            sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:launchMode="singleTask"#' "$MANIFEST"
          fi
          sed -i 's#</application>#    <service\n        android:name=".FloatingBubbleService"\n        android:enabled="true"\n        android:exported="false"\n        android:foregroundServiceType="specialUse">\n        <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="floating_bubble_overlay" />\n    </service>\n</application>#' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد التعديل -----"
          cat "$MANIFEST"

      - name: Force fixed signing config in build.gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          echo "----- build.gradle بعد الإضافة -----"
          tail -20 android/app/build.gradle

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gebhaly-rider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
