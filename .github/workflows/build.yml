name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # 🆕 بلجن @capacitor/geolocation مش بيضيف صلاحيات الموقع لملف الـ Manifest لوحده -
      # ده موضّح رسميًا في توثيق Capacitor إن المطوّر لازم يضيفها يدويًا. وبما إننا بنعمل
      # "cap add android" من الصفر في كل بيلد، بنضيف الصلاحيات هنا تلقائيًا بعد كل مرة.
      - name: Add location permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' "$MANIFEST"
          echo "----- AndroidManifest.xml بعد التعديل -----"
          cat "$MANIFEST"

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gebhaly-rider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
